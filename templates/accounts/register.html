{% extends 'base.html' %}

{% block title %}Đăng Ký - The Tea{% endblock %}

{% block guest_content %}
<div id="registerCardContainer" class="w-full max-w-md bg-white/95 backdrop-blur-2xl p-8 rounded-3xl shadow-2xl border border-emerald-500/20 space-y-6 transition-transform duration-200 ease-out">
    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-700 via-teal-600 to-emerald-400 text-white shadow-xl shadow-emerald-900/30 p-1 mb-2 transform transition hover:scale-105">
            <div class="w-full h-full bg-emerald-950/60 rounded-xl backdrop-blur flex items-center justify-center">
                <svg class="w-9 h-9 text-emerald-300 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" opacity="0.3"/>
                    <path d="M12 2.5L4.5 5.8v5.2c0 4.8 3.3 9.3 7.5 10.4 4.2-1.1 7.5-5.6 7.5-10.4V5.8L12 2.5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M12 6c-2.8 0-5 2.2-5 5 0 3.3 3.6 6.2 5 7.1 1.4-.9 5-3.8 5-7.1 0-2.8-2.2-5-5-5zm0 10c-1.2-.8-3.3-3.2-3.3-4.8 0-1.8 1.5-3.3 3.3-3.3s3.3 1.5 3.3 3.3c0 1.6-2.1 4-3.3 4.8z" fill="#34d399"/>
                </svg>
            </div>
        </div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-emerald-800 via-teal-700 to-emerald-600 bg-clip-text text-transparent tracking-tight">Đăng Ký Tài Khoản</h1>
        <p class="text-xs font-medium text-emerald-900 bg-emerald-50/90 p-3 rounded-2xl border border-emerald-200/80">
            <i class="fa-solid fa-leaf mr-1 text-emerald-600"></i>
            Hệ thống tự động khởi tạo tài khoản & xác thực qua mã OTP 4 số.
        </p>
    </div>

    <!-- Alert Notification Message -->
    <div id="registerAlert" class="hidden p-3.5 rounded-xl text-xs font-semibold"></div>

    <form id="registerForm" method="POST" action="{% url 'accounts:register' %}" class="space-y-4">
        {% csrf_token %}
        
        <!-- Email Input + Get OTP Button -->
        <div>
            <label for="regEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email Được Mời *</label>
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-envelope text-xs"></i>
                    </span>
                    <input type="email" id="regEmail" name="email" required placeholder="email.duoc.moi@example.com" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>
                <button type="button" id="getRegOtpBtn" onclick="requestRegOtp()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow transition shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                    <span>Lấy mã OTP</span>
                </button>
            </div>
        </div>

        <div>
            <label for="regFullName" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Họ Và Tên (Tùy chọn)</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                    <i class="fa-regular fa-user text-xs"></i>
                </span>
                <input type="text" id="regFullName" name="full_name" placeholder="Nguyễn Văn A" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label for="regPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Mật Khẩu *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="regPassword" name="password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>
            </div>

            <div>
                <label for="regConfirmPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Xác Nhận *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-shield-halved text-xs"></i>
                    </span>
                    <input type="password" id="regConfirmPassword" name="confirm_password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>
            </div>
        </div>

        <!-- Single-Screen Unfolded OTP Section -->
        <div id="regOtpSection" class="hidden space-y-4 pt-4 border-t border-slate-100 transition-all duration-300">
            
            <!-- Live 10-Minute Countdown Timer & Resend OTP Button -->
            <div class="p-3.5 bg-pink-50/80 border border-pink-200/80 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-pink-700">
                    <i class="fa-regular fa-clock text-sm animate-pulse"></i>
                    <span>Thời gian OTP: <span id="regCountdownTimer" class="font-mono text-sm text-pink-600 font-extrabold">10:00</span></span>
                </div>
                <button type="button" id="resendRegOtpBtn" onclick="requestRegOtp()" class="text-xs font-bold text-pink-600 hover:text-pink-800 underline transition">
                    Gửi lại mã OTP
                </button>
            </div>

            <!-- OTP Code Input -->
            <div>
                <label for="regOtpCode" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Mã OTP 4 Chữ Số *</label>
                <input type="text" id="regOtpCode" name="otp_code" maxlength="4" placeholder="1234" class="w-full text-center tracking-[0.5em] font-mono text-xl font-bold py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="regSubmitBtn" class="w-full py-3 px-4 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-700 hover:to-rose-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-pink-200/80 transition">
                Xác Nhận & Đăng Ký Tài Khoản
            </button>
        </div>
    </form>

    <div class="text-center pt-2 border-t border-slate-100">
        <p class="text-xs text-slate-500">
            Đã có tài khoản? 
            <a href="{% url 'accounts:login' %}" class="font-bold text-pink-600 hover:underline">Quay về Đăng nhập</a>
        </p>
    </div>
</div>

<script>
    let regTimerInterval = null;
    let regSecondsLeft = 600; // 10 minutes

    function showRegAlert(msg, isSuccess = true) {
        const alert = document.getElementById('registerAlert');
        alert.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
        alert.classList.add('border', 'p-3.5', 'rounded-xl', 'text-xs', 'font-semibold');
        
        if (isSuccess) {
            alert.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
        } else {
            alert.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
        }
        alert.innerText = msg;
    }

    function startReg10MinTimer() {
        clearInterval(regTimerInterval);
        regSecondsLeft = 600; // Reset to 10 minutes
        const timerDisplay = document.getElementById('regCountdownTimer');
        const submitBtn = document.getElementById('regSubmitBtn');
        if (submitBtn) submitBtn.disabled = false;

        regTimerInterval = setInterval(() => {
            regSecondsLeft--;
            if (regSecondsLeft <= 0) {
                clearInterval(regTimerInterval);
                timerDisplay.innerText = "00:00";
                showRegAlert("Mã OTP đã hết hạn (10 phút). Vui lòng bấm 'Gửi lại mã OTP' để nhận mã mới.", false);
                if (submitBtn) submitBtn.disabled = true;
                return;
            }

            const m = Math.floor(regSecondsLeft / 60).toString().padStart(2, '0');
            const s = (regSecondsLeft % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }, 1000);
    }

    function requestRegOtp() {
        const emailInput = document.getElementById('regEmail');
        const email = emailInput.value.trim();
        if (!email) {
            showRegAlert("Vui lòng nhập địa chỉ Email được mời.", false);
            emailInput.focus();
            return;
        }

        // Instantly unfold OTP section on same page
        document.getElementById('regOtpSection').classList.remove('hidden');
        startReg10MinTimer();

        const getOtpBtn = document.getElementById('getRegOtpBtn');
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}';
        const originalHtml = getOtpBtn.innerHTML;
        getOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Đang gửi...';
        getOtpBtn.disabled = true;

        fetch("{% url 'accounts:resend_otp_api' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                email: email,
                purpose: 'REGISTER'
            })
        })
        .then(res => res.json())
        .then(data => {
            getOtpBtn.innerHTML = originalHtml;
            getOtpBtn.disabled = false;

            if (data.status === 'success') {
                showRegAlert(data.message, true);
                const otpInput = document.getElementById('regOtpCode');
                if (otpInput) {
                    if (data.otp_code) otpInput.value = data.otp_code;
                    otpInput.focus();
                }
            } else {
                showRegAlert(data.message || "Lỗi gửi mã OTP.", false);
            }
        })
        .catch(err => {
            getOtpBtn.innerHTML = originalHtml;
            getOtpBtn.disabled = false;
            showRegAlert("Lỗi kết nối máy chủ.", false);
        });
    }

    // 3D Tilt Card Effect
    const regCard = document.getElementById('registerCardContainer');
    if (regCard) {
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 45;
            const y = (window.innerHeight / 2 - e.clientY) / 45;
            regCard.style.transform = `perspective(1000px) rotateY(${-x}deg) rotateX(${y}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            regCard.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
        });
    }
</script>
{% endblock %}
