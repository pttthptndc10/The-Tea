{% extends 'base.html' %}

{% block title %}Quên Mật Khẩu - The Tea{% endblock %}

{% block guest_content %}
<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 space-y-6">
    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-600 to-rose-500 text-white text-2xl shadow-lg shadow-pink-500/20 mb-2">
            <i class="fa-solid fa-unlock-keyhole"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Quên Mật Khẩu</h1>
        <p class="text-xs text-slate-500">Nhập email tài khoản để nhận mã OTP 4 số và đặt lại mật khẩu mới trên cùng 1 trang.</p>
    </div>

    <!-- Alert Notification Message -->
    <div id="forgotAlert" class="hidden p-3.5 rounded-xl text-xs font-semibold"></div>

    <form id="forgotPasswordForm" method="POST" action="{% url 'accounts:forgot_password' %}" class="space-y-4">
        {% csrf_token %}

        <!-- Email Field + Get OTP Button -->
        <div>
            <label for="forgotEmail" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email Tài Khoản *</label>
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-envelope text-xs"></i>
                    </span>
                    <input type="email" id="forgotEmail" name="email" required placeholder="name@example.com" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>
                <button type="button" id="getOtpBtn" onclick="requestForgotOtp()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow transition shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                    <span>Lấy mã OTP</span>
                </button>
            </div>
        </div>

        <!-- Single-Screen Unfolded OTP & New Password Section -->
        <div id="otpSection" class="hidden space-y-4 pt-4 border-t border-slate-100 transition-all duration-300">
            
            <!-- 10-Minute Countdown Timer & Resend OTP Button -->
            <div class="p-3.5 bg-pink-50/80 border border-pink-200/80 rounded-2xl flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-pink-700">
                    <i class="fa-regular fa-clock text-sm animate-pulse"></i>
                    <span>Thời gian OTP: <span id="countdownTimer" class="font-mono text-sm text-pink-600 font-extrabold">10:00</span></span>
                </div>
                <button type="button" id="resendOtpBtn" onclick="requestForgotOtp()" class="text-xs font-bold text-pink-600 hover:text-pink-800 underline transition">
                    Gửi lại mã OTP
                </button>
            </div>

            <!-- OTP Code Input -->
            <div>
                <label for="otpCode" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Mã OTP 4 Chữ Số *</label>
                <input type="text" id="otpCode" name="otp_code" maxlength="4" placeholder="1234" class="w-full text-center tracking-[0.5em] font-mono text-xl font-bold py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
            </div>

            <!-- New Password Input -->
            <div>
                <label for="newPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Mật Khẩu Mới *</label>
                <input type="password" id="newPassword" name="new_password" required placeholder="Nhập mật khẩu mới..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-700 hover:to-rose-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-pink-200/80 transition">
                Xác Nhận & Đặt Lại Mật Khẩu
            </button>
        </div>
    </form>

    <div class="text-center pt-2 border-t border-slate-100">
        <a href="{% url 'accounts:login' %}" class="text-xs font-bold text-pink-600 hover:underline">Quay về Đăng nhập</a>
    </div>
</div>

<script>
    let timerInterval = null;
    let secondsLeft = 600; // 10 minutes

    function showAlert(msg, isSuccess = true) {
        const alert = document.getElementById('forgotAlert');
        alert.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200');
        alert.classList.add('border', 'p-3.5', 'rounded-xl', 'text-xs', 'font-semibold');
        
        if (isSuccess) {
            alert.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
        } else {
            alert.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
        }
        alert.innerText = msg;
    }

    function start10MinTimer() {
        clearInterval(timerInterval);
        secondsLeft = 600; // Reset to 10 minutes
        const timerDisplay = document.getElementById('countdownTimer');
        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) submitBtn.disabled = false;

        timerInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.innerText = "00:00";
                showAlert("Mã OTP đã hết hạn (10 phút). Vui lòng bấm 'Gửi lại mã OTP' để nhận mã mới.", false);
                if (submitBtn) submitBtn.disabled = true;
                return;
            }

            const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
            const s = (secondsLeft % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }, 1000);
    }

    function requestForgotOtp() {
        const emailInput = document.getElementById('forgotEmail');
        const email = emailInput.value.trim();
        if (!email) {
            showAlert("Vui lòng nhập địa chỉ Email tài khoản.", false);
            emailInput.focus();
            return;
        }

        const getOtpBtn = document.getElementById('getOtpBtn');
        const originalHtml = getOtpBtn.innerHTML;
        getOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> Đang gửi...';
        getOtpBtn.disabled = true;

        fetch("{% url 'accounts:resend_otp_api' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                email: email,
                purpose: 'FORGOT_PASSWORD'
            })
        })
        .then(res => res.json())
        .then(data => {
            getOtpBtn.innerHTML = originalHtml;
            getOtpBtn.disabled = false;

            if (data.status === 'success') {
                showAlert(data.message, true);
                document.getElementById('otpSection').classList.remove('hidden');
                start10MinTimer();
                const otpInput = document.getElementById('otpCode');
                if (otpInput) otpInput.focus();
            } else {
                showAlert(data.message || "Lỗi gửi mã OTP.", false);
            }
        })
        .catch(err => {
            getOtpBtn.innerHTML = originalHtml;
            getOtpBtn.disabled = false;
            showAlert("Lỗi kết nối máy chủ.", false);
        });
    }
</script>
{% endblock %}
